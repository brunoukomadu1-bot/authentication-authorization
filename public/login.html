<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | JWT Fullstack Authentication App</title>
    <link rel="stylesheet" href="dashboard.html">

    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .hidden { display: none; }
        input { width: 90%; padding: 8px; margin: 10px 0; display: block; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;}
        button.logout { background: #dc3545; }
        p.message { color: #d9534f; font-weight: bold; }

        .user-box {
    border: 1px solid #ddd;
    padding: 15px;
    margin-top: 15px;
    border-radius: 5px;
}

.user-box h3 {
    margin-top: 0;
}

.delete-btn {
    background: #dc3545;
}

select {
    width: 90%;
    padding: 8px;
    margin: 10px 0;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background-color: #f8f9fa;
  padding: 10px 20px;
  border-bottom: 1px solid #dee2e6;
  border-radius: 5px;
  margin-bottom: 20px;
}

#auth-container a {
  text-decoration: none;
  color: #007bff;
  font-weight: bold;
  margin-right: 15px;
}

#auth-container a:hover {
  text-decoration: underline;
}

#logout-btn {
  padding: 8px 12px;
  background: #dc3545;
  color: white;
  border: none;
  border-radius: 3px;
  cursor: pointer;
}

#logout-btn:hover {
  background: #c82333;
}
.head {
    display: flex;
    align-items: center;
    justify-content: center;
}

    </style>
</head>
<body>

    <div class="head"> logged in</div>
    
    <header>
        <nav id="auth-container">
            <a href="index.html" id="login-link">Home</a>
            <a href="signup.html" id="signup-link">Signup</a>
            <button id="logout-btn">Logout</button>
        </nav>
        <!-- <div id="dashboard-container" class="hidden">
            <button id="logout-btn">Logout</button>
        </div> -->
    </header>


     
    

    <div id="auth-container">
        <div class="box" id="login-box">
            <h2>Log In</h2>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required />
                <input type="password" id="login-password" placeholder="Password" required />
                <button type="submit"  >Login</button>
            </form>
        </div>
    </div>

    
    <script src="login.js"></script>
</body>
</html>
