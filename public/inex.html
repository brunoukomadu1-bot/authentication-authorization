<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Fullstack Authentication App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .hidden { display: none; }
        input { width: 90%; padding: 8px; margin: 10px 0; display: block; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;}
        button.logout { background: #dc3545; }
        p.message { color: #d9534f; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Auth Forms Container -->
    <div id="auth-container">
        <div class="box" id="signup-box">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <input type="text" id="signup-username" placeholder="Username" required />
                <input type="email" id="signup-email" placeholder="Email" required />
                <input type="password" id="signup-password" placeholder="Password" required />
                <button type="submit">Register</button>
            </form>
        </div>

        <div class="box" id="login-box">
            <h2>Log In</h2>
            <form id="login-form">
                <input type="text" id="login-username" placeholder="Username" required />
                <input type="password" id="login-password" placeholder="Password" required />
                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!-- Protected View Container -->
    <div id="dashboard-container" class="hidden">
        <div class="box">
            <h2 id="welcome-banner">Welcome Dashboard</h2>
            <p id="dashboard-data">Loading secret assets...</p>
            <button class="logout" id="logout-btn">Log Out</button>
        </div>
    </div>

    <p class="message" id="system-msg"></p>

    <script src="index.js"></script>
</body>
</html>
