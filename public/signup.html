<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup | JWT Fullstack Authentication App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .hidden { display: none; }
        input { width: 90%; padding: 8px; margin: 10px 0; display: block; }
        button { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer;}
        button.logout { background: #dc3545; }
        p.message { color: #d9534f; font-weight: bold; }

        .user-box {
    border: 1px solid #ddd;
    padding: 15px;
    margin-top: 15px;
    border-radius: 5px;
}

.user-box h3 {
    margin-top: 0;
}

.delete-btn {
    background: #dc3545;
}

select {
    width: 90%;
    padding: 8px;
    margin: 10px 0;
}
    </style>
</head>
<body>
  <div class="box" id="signup-box">
            <h2>Sign Up</h2>
            <form id="signup-form">
                <input type="text" id="signup-username" placeholder="Username" required />
                <input type="email" id="signup-email" placeholder="Email" required />
                <input type="password" id="signup-password" placeholder="Password" required />
                <button type="submit">Register</button>
            </form>
        </div>
     
    <script src="index.js"></script>
</body>
</html>
